<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BashCapital — Башкортостан</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Spectral:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #10201e;
      --panel: rgba(14, 28, 27, 0.88);
      --line: rgba(214, 232, 224, 0.12);
      --text: #e8f2ee;
      --muted: #9bb5ac;
      --accent: #3d9b84;
      --accent-2: #d2b36a;
      --danger: #c46b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Manrope, system-ui, sans-serif;
      background:
        linear-gradient(180deg, rgba(10,20,19,.72), rgba(10,20,19,.88)),
        url("./assets/bg/city_backdrop.jpg") center/cover fixed;
    }
    .shell {
      max-width: 1280px; margin: 0 auto; padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
    }
    @media (display-mode: fullscreen) {
      .shell { max-width: none; }
    }
    header {
      display: flex; gap: 16px; align-items: center; justify-content: space-between;
      padding: 14px 18px; border: 1px solid var(--line); border-radius: 18px;
      background: var(--panel); backdrop-filter: blur(10px);
    }
    .brand { display: flex; gap: 14px; align-items: center; }
    .brand img { height: 52px; border-radius: 10px; }
    .brand h1 {
      margin: 0; font-family: Spectral, serif; font-size: 28px; font-weight: 700;
      letter-spacing: 0.02em;
    }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .stats { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
    .stats strong { color: var(--text); font-weight: 700; }
    .grid {
      display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; margin-top: 16px;
    }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px; backdrop-filter: blur(10px);
    }
    .card h2 {
      margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--accent-2); font-weight: 700;
    }
    button, select, input {
      width: 100%; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255,255,255,.04); color: var(--text); padding: 10px 12px;
      font: inherit; margin: 0 0 8px;
    }
    button {
      background: linear-gradient(180deg, #3fa58c, #2f7f6c); border: none; cursor: pointer;
      font-weight: 700;
    }
    button.secondary { background: rgba(255,255,255,.06); border: 1px solid var(--line); font-weight: 600; }
    button:hover { filter: brightness(1.08); }
    #map {
      width: 100%; height: 560px; border-radius: 14px; background: rgba(0,0,0,.25);
      display: block;
    }
    .log, .rank { max-height: 280px; overflow: auto; font-size: 13px; color: var(--muted); }
    .rank div, .log div { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .art {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
    }
    .art img { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
    .pill {
      display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(61,155,132,.2);
      color: #b7ebe0; font-size: 12px; margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <img src="./assets/ui/logo_bashcapital.jpg" alt="BashCapital" />
        <div>
          <h1>BashCapital</h1>
          <p>Онлайн-экономика Башкортостана · Godot-клиент + этот web-превью</p>
        </div>
      </div>
      <div class="stats">
        <div>Тик <strong id="tick">—</strong></div>
        <div>Дата <strong id="date">—</strong></div>
        <div>Касса <strong id="cash">—</strong></div>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Фирма</h2>
        <input id="server" value="http://127.0.0.1:8080" />
        <input id="name" value="Уфимский Комбинат" placeholder="Название" />
        <select id="industry">
          <option value="dairy">Молочка</option>
          <option value="furniture">Мебель</option>
          <option value="steel">Металл</option>
        </select>
        <button id="register">Открыть фирму</button>
        <button class="secondary" id="refresh">Обновить мир</button>
        <button class="secondary" id="tickBtn">Сделать тик (dev)</button>
        <h2 style="margin-top:16px">Графика</h2>
        <select id="quality">
          <option value="0">Низкое</option>
          <option value="1">Среднее</option>
          <option value="2" selected>Высокое</option>
          <option value="3">Ультра (машины, деревья, шейдер)</option>
        </select>
        <h2 style="margin-top:12px">Подписка · заместитель</h2>
        <div id="subStatus" style="color:var(--muted);font-size:13px;margin-bottom:8px">Подписка не активна</div>
        <button id="subscribe">Оформить подписку (mock)</button>
        <input id="deputyName" value="Заместитель" />
        <button class="secondary" id="hireDeputy">Нанять заместителя</button>
        <label style="display:block;font-size:13px;color:var(--muted)"><input type="checkbox" class="task" value="procure_inputs" checked /> Поставщики</label>
        <label style="display:block;font-size:13px;color:var(--muted)"><input type="checkbox" class="task" value="restock" checked /> Магазины</label>
        <label style="display:block;font-size:13px;color:var(--muted)"><input type="checkbox" class="task" value="price_retail" checked /> Цены</label>
        <label style="display:block;font-size:13px;color:var(--muted)"><input type="checkbox" class="task" value="sell_excess" /> Сбыт</label>
        <label style="display:block;font-size:13px;color:var(--muted)"><input type="checkbox" class="task" value="research" /> R&D</label>
        <label style="display:block;font-size:13px;color:var(--muted)"><input type="checkbox" class="task" value="auto_contracts" /> Контракты</label>
        <button class="secondary" id="applyTasks">Выдать задания</button>
        <div style="margin-top:12px">
          <span class="pill" id="cityPill">Уфа</span>
          <button class="secondary" id="ufa">Уфа</button>
          <button class="secondary" id="bel">Белорецк</button>
        </div>
        <div class="art">
          <img src="./assets/icons/buildings_sheet.jpg" alt="Здания" />
          <img src="./assets/icons/items_sheet.jpg" alt="Товары" />
        </div>
      </section>

      <section class="card">
        <h2>Город · 2.5D сетка</h2>
        <canvas id="map" width="900" height="560"></canvas>
        <div id="tileInfo" style="margin-top:10px;color:var(--muted);font-size:14px">Клик по участку для действий</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
          <select id="buildType"></select>
          <button id="build">Построить</button>
          <button class="secondary" id="buyParcel">Купить участок</button>
          <button class="secondary" id="rent">Аренда магазина</button>
          <button class="secondary" id="develop">Жилой проект</button>
          <button class="secondary" id="truck">Купить фуру</button>
        </div>
      </section>

      <section class="card">
        <h2>Рейтинг</h2>
        <div class="rank" id="rank"></div>
        <h2 style="margin-top:18px">Журнал тика</h2>
        <div class="log" id="log"></div>
      </section>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
