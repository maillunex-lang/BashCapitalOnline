<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BashCapital · Admin</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { max-width: 720px; margin: 0 auto; padding: 24px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    input, select, button { padding: 8px 10px; }
    pre { background: #122; color: #cde; padding: 12px; overflow: auto; max-height: 320px; }
  </style>
</head>
<body>
  <h1>Админ мира</h1>
  <p class="muted">Токен в заголовке <code>X-Admin-Token</code> (по умолчанию <code>bashcapital-dev</code>).</p>
  <div class="row">
    <input id="url" value="http://127.0.0.1:8080" style="flex:1" />
    <input id="token" value="bashcapital-dev" />
    <button id="statusBtn">Статус</button>
  </div>
  <div class="row">
    <button id="tickBtn">Force tick</button>
    <button id="pauseBtn">Pause</button>
    <button id="resumeBtn">Resume</button>
  </div>
  <div class="row">
    <select id="city"></select>
    <button id="enableBtn">Enable city</button>
    <button id="disableBtn">Disable city</button>
  </div>
  <div class="row">
    <input id="from" placeholder="from city" value="ufa" />
    <input id="to" placeholder="to city" value="beloretsk" />
    <button id="routeBtn">Route quote</button>
  </div>
  <pre id="out">—</pre>
  <script>
    const $ = (id) => document.getElementById(id);
    const base = () => $("url").value.replace(/\/$/, "");
    const headers = () => ({ "Content-Type": "application/json", "X-Admin-Token": $("token").value });
    async function api(path, opts = {}) {
      const res = await fetch(base() + path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
      const text = await res.text();
      try { return JSON.parse(text); } catch { return { error: text, status: res.status }; }
    }
    $("statusBtn").onclick = async () => { $("out").textContent = JSON.stringify(await api("/api/admin/status"), null, 2); };
    $("tickBtn").onclick = async () => { $("out").textContent = JSON.stringify(await api("/api/admin/tick", { method: "POST", body: "{}" }), null, 2); };
    $("pauseBtn").onclick = async () => { $("out").textContent = JSON.stringify(await api("/api/admin/pause", { method: "POST", body: JSON.stringify({ paused: true }) }), null, 2); };
    $("resumeBtn").onclick = async () => { $("out").textContent = JSON.stringify(await api("/api/admin/pause", { method: "POST", body: JSON.stringify({ paused: false }) }), null, 2); };
    $("enableBtn").onclick = async () => {
      $("out").textContent = JSON.stringify(await api("/api/admin/cities", { method: "POST", body: JSON.stringify({ city_id: $("city").value, enabled: true }) }), null, 2);
    };
    $("disableBtn").onclick = async () => {
      $("out").textContent = JSON.stringify(await api("/api/admin/cities", { method: "POST", body: JSON.stringify({ city_id: $("city").value, enabled: false }) }), null, 2);
    };
    $("routeBtn").onclick = async () => {
      $("out").textContent = JSON.stringify(await api(`/api/route?from=${$("from").value}&to=${$("to").value}`), null, 2);
    };
    (async () => {
      const cities = await api("/api/admin/cities");
      if (Array.isArray(cities)) {
        $("city").innerHTML = cities.map((c) => `<option value="${c.id}">${c.name} (${c.enabled ? "on" : "off"})</option>`).join("");
      }
    })();
  </script>
</body>
</html>
